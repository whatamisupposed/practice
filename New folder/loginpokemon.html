<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Login</title>
    <!--Bootstrap 4 CDN-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" 
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" 
    crossorigin="anonymous">
    
    <!--Fontawesome CDN-->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" 
    integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" 
    crossorigin="anonymous">

    <!--Custom styles-->
    <link rel="stylesheet" href="login.css">
    <style>
        /* Pokémon Themed Styles */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        html, body {
            background-image: url('https://wallpaperaccess.com/full/12345.jpg'); /* Replace with Pokémon-themed image */
            background-size: cover;
            background-repeat: no-repeat;
            height: 100%;
            font-family: 'Press Start 2P', sans-serif;
        }

        .card {
            height: 500px;
            margin-top: auto;
            margin-bottom: auto;
            width: 400px;
            background-color: rgba(0, 0, 0, 0.8) !important;
            border: 2px solid #FFC312;
            border-radius: 15px;
        }

        .card-header h3 {
            color: #FFC312;
            text-shadow: 2px 2px 5px #000;
        }

        .card-body {
            color: white;
        }

        .input-group-prepend span {
            background-color: #FFC312;
            color: black;
            border: 0 !important;
        }

        .login_btn {
            color: black;
            background-color: #FFC312;
            width: 100%;
        }

        .login_btn:hover {
            background-color: white;
        }

        .remember {
            color: white;
        }

        .links a {
            color: #FFC312;
        }

        .social_icon span {
            font-size: 40px;
            margin-left: 10px;
            color: #FFC312;
        }

        .social_icon span:hover {
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-center h-100">
        <div class="card">
            <div class="card-header">
                <h3 id="formTitle">Pokémon Trainer Login</h3>
                <div class="d-flex justify-content-end social_icon">
                    <span><i class="fab fa-facebook-square"></i></span>
                    <span><i class="fab fa-google-plus-square"></i></span>
                    <span><i class="fab fa-twitter-square"></i></span>
                </div>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="input-group form-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control" placeholder="Trainer Name" id="username" required>
                    </div>
                    <div class="input-group form-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                        </div>
                        <input type="password" class="form-control" placeholder="Password" id="password" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn float-right login_btn" id="formButton">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer">
                <div class="d-flex justify-content-center links">
                    <span id="toggleText">Don’t have an account? </span><a href="#" id="toggleForm">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    let isLogin = true; // Track whether the user is logging in or signing up

    document.getElementById("toggleForm").addEventListener("click", function () {
        isLogin = !isLogin;

        if (isLogin) {
            document.getElementById("formTitle").textContent = "Pokémon Trainer Login";
            document.getElementById("formButton").textContent = "Login";
            document.getElementById("toggleText").textContent = "Don’t have an account? ";
            this.textContent = "Sign Up";
        } else {
            document.getElementById("formTitle").textContent = "Pokémon Trainer Sign-Up";
            document.getElementById("formButton").textContent = "Sign Up";
            document.getElementById("toggleText").textContent = "Already have an account? ";
            this.textContent = "Login";
        }
    });

    document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value.toLowerCase();
        const password = document.getElementById("password").value;

        if (isLogin) {
            // Handle Login
            const storedPassword = localStorage.getItem(username);

            if (storedPassword && storedPassword === password) {
                alert("Welcome, Trainer " + username.charAt(0).toUpperCase() + username.slice(1) + "!");
                window.location.href = "index.html"; // Redirect to index.html
            } else {
                alert("Invalid username or password. Please try again.");
            }
        } else {
            // Handle Sign-Up
            if (localStorage.getItem(username)) {
                alert("Username already exists. Please choose a different username.");
            } else {
                localStorage.setItem(username, password);
                alert("Account created successfully! You can now log in.");
                document.getElementById("toggleForm").click(); // Switch to Login form
            }
        }
    });
</script>
</body>
</html>
